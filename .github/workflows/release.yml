# Release: push a tag vX.Y.Z (vX.Y.Z-rc.N for a prerelease). Tests gate it; then both images go to
# ghcr.io/alperencelik/ctrlplane/{platform,tenant-apiserver}:<tag> (linux/amd64 + arm64) with signed
# build provenance, and a GitHub Release gets generated notes. Both binaries share one version: the
# platform runs tenant-apiserver pods and uses the same image for their sidecars.
name: release

on:
  push:
    tags: ['v*']

permissions: {}

env:
  REGISTRY: ghcr.io/alperencelik/ctrlplane
  VERSION: ${{ github.ref_name }}

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write # the GitHub Release
      packages: write # ghcr.io
      id-token: write # signed build provenance (Sigstore)
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Test (vet, unit, envtest)
        run: make test
      - name: Generated files are committed
        run: git diff --exit-code
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0 (arm64)
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push images
        id: build
        run: |
          for target in platform tenant-apiserver; do
            docker buildx build --platform linux/amd64,linux/arm64 --target "$target" \
              --label org.opencontainers.image.source="https://github.com/${{ github.repository }}" \
              --label org.opencontainers.image.revision="${{ github.sha }}" \
              --label org.opencontainers.image.version="$VERSION" \
              --metadata-file "/tmp/$target.json" \
              --tag "$REGISTRY/$target:$VERSION" --push .
            echo "${target//-/_}=$(jq -r '."containerimage.digest"' "/tmp/$target.json")" >> "$GITHUB_OUTPUT"
          done
      # Verifiable with `gh attestation verify oci://<image>:<tag> --repo alperencelik/ctrlplane`.
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.REGISTRY }}/platform
          subject-digest: ${{ steps.build.outputs.platform }}
          push-to-registry: true
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.REGISTRY }}/tenant-apiserver
          subject-digest: ${{ steps.build.outputs.tenant_apiserver }}
          push-to-registry: true
      - name: GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=()
          [[ $VERSION == *-* ]] && prerelease=(--prerelease)
          gh release create "$VERSION" --repo "${{ github.repository }}" --verify-tag --generate-notes "${prerelease[@]}"
