# A tenant whose "operator" is kubectl watching VirtualMachines in its namespace.
# Inside the tenant API it runs as ServiceAccount demo/vm-watcher with RBAC only in namespace "demo".
apiVersion: platform.ctrlplane.run/v1alpha1
kind: Tenant
metadata:
  name: demo
spec:
  controllers:
  - name: vm-watcher
    image: registry.k8s.io/kubectl:v1.34.0
    args: [get, virtualmachines.proxmox.example.com, --watch, --output-watch-events]
    env:
    - name: HOME
      value: /tmp
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        memory: 128Mi
